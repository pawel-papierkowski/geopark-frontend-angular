<div
  #pickerRef
  class="picker-time"
  [class.invalid]="invalid()"
  (focusout)="handleFocusOut($event)">

  <input
    #inputRef
    [id]="`${ident()}_input`"
    [attr.data-testid]="`${ident()}_input`"
    type="text"
    class="picker-input-time"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"

    [value]="displayTimeValue()"
    [placeholder]="placeholderTimeValue()"
    [disabled]="disabled()"
    readonly
    autocomplete="off"
    role="combobox"
    [tabindex]="disabled() ? -1 : 0"

    aria-haspopup="dialog"
    [attr.aria-expanded]="isClockVisible()"
    [attr.aria-controls]="`${ident()}_panel`"
    [attr.aria-label]="label() ? null : ('dateTimePicker.time' | translate)"
    [attr.aria-labelledby]="nameRefs()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (mousedown)="handleMousedown($event)"
    (focus)="handleInputFocus()"
    (click)="handleClick()"
    (keydown)="onInputKeydown($event)" />

  <!-- Decorative clock glyph: kept OUT of the input value and placeholder because a screen
       reader announces the field's value and would read "clock face one-thirty" before the
       time. aria-hidden keeps it out of browse mode as well; positioned over the input's
       left padding (pointer-events: none in CSS, so clicks still reach the input). -->
  <span
    class="picker-time-icon"
    [attr.data-testid]="`${ident()}_icon`"
    aria-hidden="true">🕜</span>

  <!-- Hidden accessible-name qualifier: referenced as the second id of the input's
       `aria-labelledby` (see `nameRefs`) so the time input stays distinguishable from the
       date input in `datetime` mode, where both are named after the same visible <label>. -->
  @if (label() && qualifyLabel()) {
    <span [id]="`${ident()}_qualifier`" class="picker-name-qualifier">{{ 'dateTimePicker.time' | translate }}</span>
  }

  <!-- Time picker: clock panel. Named by a dedicated key - it is a dialog of its own, the
        placeholder ("hh:mm") is a format hint, not a name. -->
  <div
    #clockPanelRef
    [id]="`${ident()}_panel`"
    [attr.data-testid]="`${ident()}_panel`"
    class="clock-container"
    [style]="containerStyle()"
    [style.display]="isClockVisible() ? '' : 'none'"
    role="dialog"

    [attr.aria-label]="'dateTimePicker.timePicker' | translate"

    (mousedown)="handlePanelMousedown($event)">

    <div class="clock-columns">

      <!-- Hours column: static header above the scroller (header lives OUTSIDE the scroll
            container, so it never overlays the options while they scroll). -->
      <div class="clock-column-group">
        <div class="column-header" aria-hidden="true">{{ 'dateTimePicker.hour' | translate }}</div>
        <div
          #hourRef
          class="clock-column"
          role="listbox"
          aria-orientation="vertical"
          tabindex="-1"
          [attr.aria-label]="'dateTimePicker.hour' | translate"
          [attr.aria-activedescendant]="hourActiveDesc()"
          (keydown)="onHourKeydown($event)"
          (focus)="activeColumn.set('hour')">
          @for (h of hours; track h) {
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- options are focus-managed by the parent listbox via aria-activedescendant, not individually focusable -->
            <div
              [id]="`${ident()}_opt_h${h}`"
              [attr.data-testid]="`${ident()}_h${h}`"
              class="time-item time-hour"
              [class.selected]="selectedHour() === h"
              [class.curr]="viewHour() === h"
              [class.focused]="activeColumn() === 'hour' && focusedHour() === h"
              role="option"
              [attr.aria-selected]="selectedHour() === h"
              [attr.aria-current]="viewHour() === h ? 'time' : null"
              (mousedown)="handleMousedownOption('hour', h)"
              (click)="handleHourClick(h)">
              {{ h.toString().padStart(2, '0') }}
            </div>
          }
        </div>
      </div>

      <!-- Minutes column: same header-above-scroller layout as the hours column. -->
      <div class="clock-column-group">
        <div class="column-header" aria-hidden="true">{{ 'dateTimePicker.minute' | translate }}</div>
        <div
          #minuteRef
          class="clock-column"
          role="listbox"
          aria-orientation="vertical"
          tabindex="-1"
          [attr.aria-label]="'dateTimePicker.minute' | translate"
          [attr.aria-activedescendant]="minuteActiveDesc()"
          (keydown)="onMinuteKeydown($event)"
          (focus)="activeColumn.set('minute')">
          @for (m of minutes; track m) {
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- options are focus-managed by the parent listbox via aria-activedescendant, not individually focusable -->
            <div
              [id]="`${ident()}_opt_m${m}`"
              [attr.data-testid]="`${ident()}_m${m}`"
              class="time-item time-minute"
              [class.selected]="selectedMinute() === m"
              [class.curr]="viewMinute() === m"
              [class.focused]="activeColumn() === 'minute' && focusedMinute() === m"
              role="option"
              [attr.aria-selected]="selectedMinute() === m"
              [attr.aria-current]="viewMinute() === m ? 'time' : null"
              (mousedown)="handleMousedownOption('minute', m)"
              (click)="handleMinuteClick(m)">
              {{ m.toString().padStart(2, '0') }}
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</div>
