<div
  #pickerRef
  class="picker-time"
  [class.invalid]="invalid()"
  (focusout)="handleFocusOut($event)">

  <input
    #inputRef
    [id]="`${ident()}_input`"
    [attr.data-testid]="`${ident()}_input`"
    type="text"
    class="picker-input-time"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"

    [value]="displayTimeValue()"
    [placeholder]="placeholderTimeValue()"
    [disabled]="disabled()"
    readonly
    autocomplete="off"
    role="combobox"
    [tabindex]="disabled() ? -1 : 0"

    aria-haspopup="dialog"
    [attr.aria-expanded]="isClockVisible()"
    [attr.aria-controls]="`${ident()}_panel`"
    [attr.aria-label]="label() ? null : timeLabel()"
    [attr.aria-labelledby]="nameRefs()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (mousedown)="handleMousedown($event)"
    (focus)="handleInputFocus()"
    (click)="handleClick()"
    (keydown)="onInputKeydown($event)" />

  <!-- Decorative clock glyph: kept OUT of the input value and placeholder because a screen
       reader announces the field's value and would read "clock face one-thirty" before the
       time. aria-hidden keeps it out of browse mode as well; positioned over the input's
       left padding (pointer-events: none in CSS, so clicks still reach the input). -->
  <span
    class="picker-time-icon"
    [attr.data-testid]="`${ident()}_icon`"
    aria-hidden="true">🕜</span>

  <!-- Hidden accessible-name qualifier: referenced as the second id of the input's
       `aria-labelledby` (see `nameRefs`) so the time input stays distinguishable from the
       date input in `datetime` mode, where both are named after the same visible <label>. -->
  @if (label() && qualifyLabel()) {
    <span [id]="`${ident()}_qualifier`" class="picker-name-qualifier">{{ timeLabel() }}</span>
  }

  <!-- Time picker: clock panel. Named by a dedicated key - it is a dialog of its own, the
        placeholder ("hh:mm") is a format hint, not a name. -->
  <div
    #panelRef
    [id]="`${ident()}_panel`"
    [attr.data-testid]="`${ident()}_panel`"
    class="clock-container"
    [style]="containerStyle()"
    [style.display]="isClockVisible() ? '' : 'none'"
    role="dialog"

    [attr.aria-label]="panelLabel()"

    (mousedown)="handlePanelMousedown($event)">

    <div class="clock-columns">

      <!-- Clock columns (hours, minutes): one block rendered from `columnList`. The two
            listboxes differ only in data carried by the column descriptor (label, options,
            id suffix, keyboard bounds, cursor signals); everything behavioural lives once in
            the component. Static header sits above the scroller (header lives OUTSIDE the
            scroll container, so it never overlays the options while they scroll).
            The shared `#colRef` template ref feeds `hourRef`/`minuteRef` (first/second
            column) via `columnElements`, in display order. -->
      @for (col of columnList; track col.key) {
        <div class="clock-column-group">
          <div class="column-header" aria-hidden="true">{{ col.label() }}</div>
          <div
            #colRef
            class="clock-column"
            role="listbox"
            aria-orientation="vertical"
            tabindex="-1"
            [attr.aria-label]="col.label()"
            [attr.aria-activedescendant]="col.activeDesc()"
            (keydown)="onColumnKeydown(col.key, $event)"
            (focus)="activeColumn.set(col.key)">
            @for (option of col.items; track option) {
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- options are focus-managed by the parent listbox via aria-activedescendant, not individually focusable -->
              <div
                [id]="`${ident()}_opt_${col.suffix}${option}`"
                [attr.data-testid]="`${ident()}_${col.suffix}${option}`"
                [class]="'time-item ' + col.optionClass"
                [class.selected]="col.selected() === option"
                [class.curr]="col.view() === option"
                [class.focused]="activeColumn() === col.key && col.focused() === option"
                role="option"
                [attr.aria-selected]="col.selected() === option"
                [attr.aria-current]="col.view() === option ? 'time' : null"
                (mousedown)="handleMousedownOption(col.key, option)"
                (click)="handleOptionClick(col.key, option)">
                {{ option.toString().padStart(2, '0') }}
              </div>
            }
          </div>
        </div>
      }

    </div>
  </div>
</div>
