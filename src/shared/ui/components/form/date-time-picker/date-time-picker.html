<div
  #pickerRef
  class="picker-general"
  (focusin)="handleFocusIn($event)">

  <!-- Hidden button: labelable target for <label for="...">. -->
  <!-- Label activation focuses this button and bubbles its click here; both handlers redirect
        focus to the root so aria-activedescendant stays valid and (blur) works on leaving. -->
  <button type="button" [id]="ident()" class="hidden-label-button" tabindex="-1" aria-hidden="true"
    (focus)="focusRoot()" (click)="focusRoot()"></button>

  @if (mode() === 'datetime' || mode() === 'date') {
    <date-picker
      #datePickerRef
      [(value)]="value"

      [attr.ident]="`dateId_${ident()}`"
      [label]="label()"
      [canNull]="canNull()"
      [showWeeks]="showWeeks()"
      [dateMin]="dateMin()"
      [dateMax]="dateMax()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }

  @if (mode() === 'datetime' || mode() === 'time') {
    <time-picker
      #timePickerRef
      [(value)]="value"

      [attr.ident]="`timeId_${ident()}`"
      [label]="label()"
      [canNull]="canNull()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }
</div>
