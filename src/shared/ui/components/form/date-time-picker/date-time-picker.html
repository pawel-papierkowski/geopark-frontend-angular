<div
  #rootRef
  class="picker-general"
  (focusin)="handleFocusIn($event)">

  <!-- Hidden button: labelable target for <label for="...">. -->
  <!-- Label activation focuses this button (handleLabelFocus redirects focus into the sub-picker
        input, which auto-opens its panel) and bubbles its click here (handleLabelClick swallows
        that paired click, or toggles the panel on every later activation). -->
  <button type="button" [id]="resolvedIdent()" class="hidden-label-button" tabindex="-1" aria-hidden="true"
    (focus)="handleLabelFocus()" (click)="handleLabelClick()"></button>

  @if (mode() === 'datetime' || mode() === 'date') {
    <date-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="dateIdent()"
      [label]="label()"
      [canNull]="canNull()"
      [showWeeks]="showWeeks()"
      [dateMin]="dateMin()"
      [dateMax]="dateMax()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }

  @if (mode() === 'datetime' || mode() === 'time') {
    <time-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="timeIdent()"
      [label]="label()"
      [canNull]="canNull()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }
</div>
