<div
  class="picker-general"
  (focusin)="handleFocusIn($event)">

  <!-- Hidden button: labelable target for <label for="...">. -->
  <!-- Label activation focuses this button and bubbles its click here; both handlers redirect
        focus into the sub-picker input, which auto-opens its panel on focus. -->
  <button type="button" [id]="resolvedIdent()" class="hidden-label-button" tabindex="-1" aria-hidden="true"
    (focus)="focusRoot()" (click)="focusRoot()"></button>

  @if (mode() === 'datetime' || mode() === 'date') {
    <date-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="dateIdent()"
      [label]="label()"
      [canNull]="canNull()"
      [showWeeks]="showWeeks()"
      [dateMin]="dateMin()"
      [dateMax]="dateMax()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }

  @if (mode() === 'datetime' || mode() === 'time') {
    <time-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="timeIdent()"
      [label]="label()"
      [canNull]="canNull()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }
</div>
