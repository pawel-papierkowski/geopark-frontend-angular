<div
  #rootRef
  class="picker-general"
  (focusin)="handleFocusIn($event)">

  <!-- Hidden button: labelable target for <label for="...">. -->
  <!-- Engines disagree on label activation order: Chromium/Firefox focus this button then forward
        the click, WebKit forwards the click first. handleLabelFocus redirects focus into the
        sub-picker (open half on focus-first engines, restore-only when a click-first engine's
        toggle already ran); handleLabelClick swallows the paired click or toggles the panel. It is
        a sibling of the sub-pickers, so their focusout containment uses this root (forwarded to
        them as the `container` input) instead of their own subtree - that also covers focus
        moving between the two sub-pickers, which is an internal move, not a blur. -->
  <button #labelBtnRef type="button" [id]="resolvedIdent()" class="hidden-label-button" tabindex="-1" aria-hidden="true"
    (focus)="handleLabelFocus()" (click)="handleLabelClick()" [disabled]="disabled()"></button>

  <!-- Qualifier is needed ONLY in datetime mode: there the same visible <label> names BOTH
       sub-inputs, so each one appends its own hidden "Date"/"Time" suffix to stay
       distinguishable (single-mode pickers already carry a distinct fallback name). -->
  @if (mode() === 'datetime' || mode() === 'date') {
    <date-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="dateIdent()"
      [label]="label()"
      [qualifyLabel]="mode() === 'datetime'"
      [container]="rootRef"
      [canNull]="canNull()"

      [showWeeks]="showWeeks()"
      [dateMin]="dateMin()"
      [dateMax]="dateMax()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }

  @if (mode() === 'datetime' || mode() === 'time') {
    <time-picker
      [(value)]="value"
      (touch)="touch.emit()"

      [ident]="timeIdent()"
      [label]="label()"
      [qualifyLabel]="mode() === 'datetime'"
      [container]="rootRef"
      [canNull]="canNull()"

      [required]="required()"
      [disabled]="disabled()"
      [invalid]="invalid()"
    />
  }
</div>
