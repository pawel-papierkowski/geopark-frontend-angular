<div
  #pickerRef
  class="picker-date"
  [class.invalid]="invalid()"
  (focusout)="handleFocusOut($event)">

  <input
    #inputRef
    [id]="`${ident()}_input`"
    [attr.data-testid]="`${ident()}_input`"
    type="text"
    class="picker-input-date"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"

    [value]="displayDateValue()"
    [placeholder]="placeholderDateValue()"
    [disabled]="disabled()"
    readonly
    autocomplete="off"
    role="combobox"
    [tabindex]="disabled() ? -1 : 0"

    aria-haspopup="dialog"
    [attr.aria-expanded]="isCalendarVisible()"
    [attr.aria-controls]="`${ident()}_panel`"
    [attr.aria-label]="label() ? null : ('dateTimePicker.date' | translate)"
    [attr.aria-labelledby]="label() || null"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (mousedown)="handleMousedown($event)"
    (focus)="handleInputFocus()"
    (click)="handleClick()"
    (keydown)="onInputKeydown($event)" />

  <!-- Decorative calendar glyph: kept OUT of the input value and placeholder because a screen
       reader announces the field's value and would read "calendar face one-thirty" before the
       date. aria-hidden keeps it out of browse mode as well; positioned over the input's
       left padding (pointer-events: none in CSS, so clicks still reach the input). -->
  <span
    class="picker-date-icon"
    [attr.data-testid]="`${ident()}_icon`"
    aria-hidden="true">📅</span>

  <!-- Date picker: calendar panel. Named by a dedicated key - it is a dialog of its own. -->
  <div
    #calendarPanelRef
    [id]="`${ident()}_panel`"
    [attr.data-testid]="`${ident()}_panel`"
    class="calendar-container"
    [style]="containerStyle()"
    [style.display]="isCalendarVisible() ? '' : 'none'"
    role="dialog"

    [attr.aria-label]="'dateTimePicker.datePicker' | translate"

    (mousedown)="handlePanelMousedown($event)">

    <div class="calendar-header">
      <div class="header-nav">
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- we can navigate to next/prev month via calendar grid -->
        <div
          class="header-navbtn"
          [attr.data-testid]="`${ident()}_yearMinus`"
          [attr.aria-label]="'dateTimePicker.yearMinus' | translate"
          (click)="changeYear(-1)">
          ⏪
        </div>
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- we can navigate to next/prev month via calendar grid -->
        <div
          class="header-navbtn"
          [attr.data-testid]="`${ident()}_monthMinus`"
          [attr.aria-label]="'dateTimePicker.monthMinus' | translate"
          (click)="changeMonth(-1)">
          ◀️
        </div>
      </div>
      <div class="header-title" aria-live="polite">
        {{ headerText() }}
      </div>
      <div class="header-nav">
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- we can navigate to next/prev month via calendar grid -->
        <div
          class="header-navbtn"
          [attr.data-testid]="`${ident()}_monthPlus`"
          [attr.aria-label]="'dateTimePicker.monthPlus' | translate"
          (click)="changeMonth(1)">
          ▶️
        </div>
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- we can navigate to next/prev month via calendar grid -->
        <div
          class="header-navbtn"
          [attr.data-testid]="`${ident()}_yearPlus`"
          [attr.aria-label]="'dateTimePicker.yearPlus' | translate"
          (click)="changeYear(1)">
          ⏩
        </div>
      </div>
    </div>

    <div
      #calendarGridRef
      class="calendar-grid"
      tabindex="0"
      [style]="gridStyle()"
      role="grid"
      [aria-label]="headerText()"
      [aria-activedescendant]="activeDescendantId()"
      (keydown)="onGridKeydown($event)">

      <!-- This row shows days of week. -->
      @if(showWeeks()) {
        <div aria-hidden="true"></div> <!-- we need empty cell here for layout with week numbers -->
      }
      @for(day of daysOfWeek; track day) {
        <div class="weekday" aria-hidden="true">
          {{ 'dateTimePicker.dayOfWeek.' + day | translate }}
        </div>
      }

      <!-- Rest shows week number (if present) and seven days in row. -->
      @for(calendarCell of calendarCells(); track $index) {
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- navigation handled on calendarGridRef div -->
        <div
          [id]="calendarCell.type === EnCalendarCellType.Date ? `${ident()}_cell_${$index}` : undefined"
          [attr.data-testid]="calendarCell.testid"
          [class]="resolveCellClass(calendarCell)"
          role="gridcell"
          [attr.aria-selected]="calendarCell.type === EnCalendarCellType.Date ? isDaySelected(calendarCell) : undefined"
          [attr.aria-disabled]="calendarCell.type === EnCalendarCellType.Date ? isDayDisabled(calendarCell) || undefined : undefined"
          [attr.aria-label]="
            calendarCell.type === EnCalendarCellType.Date
              ? `${calendarCell.year} ${'dateTimePicker.month.' + calendarCell.month | translate} ${calendarCell.day}`
              : undefined"
          (click)="selectCell(calendarCell)">
          {{ calendarCell.day }}
        </div>
      }
    </div>
  </div>
</div>
