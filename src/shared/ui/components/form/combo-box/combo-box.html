<div
    #comboRef
    [attr.data-testid]="resolvedIdent()"
    class="combobox"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"
    role="combobox"
    [tabindex]="disabled() ? -1 : 0"

    [aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    [aria-controls]="listboxId()"
    [aria-activedescendant]="highlightedIndex() >= 0 ? optionId(highlightedIndex()) : undefined"
    [attr.aria-labelledby]="label() || null"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (focus)="handleFocus()"
    (click)="handleClick()"
    (mousedown)="handleMousedown()"
    (keydown)="handleKeydown($event)"
    (blur)="handleBlur($event)">

    <!-- Hidden button: labelable target for <label for="...">. -->
    <!-- Label activation focuses this button and bubbles its click here; both handlers redirect
         focus to the root so aria-activedescendant stays valid and (blur) works on leaving. -->
    <button type="button" [id]="resolvedIdent()" class="hidden-label-button" tabindex="-1" aria-hidden="true"
      (focus)="focusRoot()" (click)="focusRoot()"></button>

    <div class="combobox-selected">
      <span class="combobox-selected-text">{{ selectedText() }}</span>
      <span class="combobox-arrow" [class]="arrowClass()"></span>
    </div>

    <div
      #optionsRef
      class="combobox-options"
      [id]="listboxId()"
      [style]="containerStyle()"
      [style.display]="isOpen() ? '' : 'none'"
      role="listbox"
      aria-orientation="vertical">

      @for (view of optionViews(); track $index) {
        <!-- Options are not tab stops: highlight moves via aria-activedescendant on root,
             so one Tab from root closes the list and exits straight to the next component.
             Key events are bound on the root only - a keydown on an option bubbles there and
             is handled exactly once (binding it here as well would run the handler twice). -->
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- options are focus-managed by the root via aria-activedescendant, not individually focusable; keys are handled on the root -->
        <div
          [attr.data-testid]="resolvedIdent()+'_'+$index"
          [id]="optionId($index)"
          class="combobox-option"
          [class.highlighted]="highlightedIndex() === $index"

          role="option"
          tabindex="-1"

          [aria-selected]="view.option === value()"

          (click)="$event.stopImmediatePropagation(); selectOption(view.option)"
          (mousedown)="$event.preventDefault()"
          (mouseenter)="highlightedIndex.set($index)">
          {{ view.text }}
        </div>
      }
    </div>
</div>
