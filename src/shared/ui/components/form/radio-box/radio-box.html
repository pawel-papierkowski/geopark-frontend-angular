
<div class="radiobox-wrapper">
  <!-- Hidden button: labelable target for <label for="...">. -->
  <button
    type="button"
    [id]="resolvedIdent()"
    class="hidden-label-button"
    tabindex="-1"
    aria-hidden="true"
    [disabled]="disabled()"
    (focus)="handleLabelActivation()"
    (click)="handleLabelActivation()"></button>

  <div
    [attr.data-testid]="resolvedIdent()"
    class="radiobox"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"

    role="radiogroup"
    tabindex="-1"

    [attr.aria-labelledby]="label() || null"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (focusout)="handleFocusout($event)">

    @for (view of optionViews(); track $index) {
      <div
        #optRef
        [attr.data-testid]="resolvedIdent()+'_'+$index"
        [id]="view.id"
        class="radiobox-option"

        role="radio"
        [tabindex]="$index === tabStopIndex() ? 0 : -1"

        [attr.aria-checked]="view.option === value()"

        (mousedown)="blockIfDisabled($event)"
        (click)="selectOption(view.option, $index)"
        (keydown)="handleKeydown($event)">
        <div class="radiobox-circle" [class.mark]="view.option === value()"></div>
        <div class="radiobox-label">{{ view.text }}</div>
      </div>
    }
  </div>
</div>
