<div class="checkbox-wrapper">
  <!-- Hidden button: labelable target for <label for="...">. -->
  <button
    type="button"
    [id]="resolvedIdent()"
    class="hidden-label-button"
    tabindex="-1"
    aria-hidden="true"
    [disabled]="disabled()"
    (focus)="focusBox()"
    (click)="toggle(); focusBox()"></button>
  <div
    #checkboxRef
    [attr.data-testid]="resolvedIdent()"
    class="checkbox"
    [class.disabled]="disabled()"
    [class.invalid]="invalid()"
    [class.checked]="value() === true"
    [class.mixed]="value() === null"
    role="checkbox"
    [tabindex]="disabled() ? -1 : 0"

    [attr.aria-labelledby]="label() || null"
    [attr.aria-checked]="ariaChecked()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-disabled]="disabled() || null"

    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()"
    (blur)="touch.emit()">
  </div>
</div>
